services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env.example
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sovereignai_data:/workspace/data
      - ../knowledge_base:/workspace/knowledge_base:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sovereignai_data:
